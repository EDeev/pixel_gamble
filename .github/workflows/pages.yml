name: Web version

on:
  push:
    branches: [main]
    paths: ["game/**", "web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygbag==0.9.3
      - name: Сборка для браузера (pygbag)
        run: python -m pygbag --build --title "Pixel Gamble" --width 960 --height 540 --template web/template.tmpl game
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/build/web
      - id: deployment
        uses: actions/deploy-pages@v4
